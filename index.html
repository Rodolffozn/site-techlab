<span class="eyebrow"><span style="color: #6d28d9">◆</span> Passo 1 do caminho</span>
<h1 class="title">Novo <span style="color: #6d28d9">equipamento</span></h1>
<span class="muted">O código ({{proxEq}}) é criado sozinho.</span>
</div>
<div class="glass" style="padding: 28px; display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{efResumo}}" hint-placeholder-val="{{ false }}"><div role="alert" style="border: 1px solid #B3261E; color: #B3261E; border-radius: 0; padding: 12px 16px; font-weight: 700; background: #ffffff">{{efResumo}}</div></sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lbl">Tipo *</span>
<div role="group" aria-label="Tipo do equipamento" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{eqTipos}}" as="p" hint-placeholder-count="3">
<button type="button" class="{{p.cls}}" sc-camel-on-click="{{p.pick}}" aria-pressed="{{p.on}}" style="flex: 1 1 140px; min-height: 52px">
<svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.icon}}"></path></svg>
{{p.label}}
</button>
</sc-for>
</div>
<sc-if value="{{efe.tipo}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.tipo}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="emarca" class="lbl">Marca *</label>
<input id="emarca" class="inp" type="text" value="{{ef.marca}}" sc-camel-on-change="{{onEfMarca}}" placeholder="Dell" style="border-color: {{efe.marcaBd}}">
<sc-if value="{{efe.marca}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.marca}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="emodelo" class="lbl">Modelo *</label>
<input id="emodelo" class="inp" type="text" value="{{ef.modelo}}" sc-camel-on-change="{{onEfModelo}}" placeholder="Inspiron 15 3511" style="border-color: {{efe.modeloBd}}">
<sc-if value="{{efe.modelo}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.modelo}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="eserie" class="lbl">Número de série (opcional)</label>
<input id="eserie" class="inp" type="text" value="{{ef.serie}}" sc-camel-on-change="{{onEfSerie}}" placeholder="" style="border-color: {{efe.serieBd}}">
<sc-if value="{{efe.serie}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.serie}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ecpu" class="lbl">CPU *</label>
<input id="ecpu" class="inp" type="text" value="{{ef.cpu}}" sc-camel-on-change="{{onEfCpu}}" placeholder="Intel Core i5-1135G7" style="border-color: {{efe.cpuBd}}">
<sc-if value="{{efe.cpu}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.cpu}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="eram" class="lbl">RAM (GB) *</label>
<input id="eram" class="inp" type="text" inputmode="numeric" value="{{ef.ram}}" sc-camel-on-change="{{onEfRam}}" placeholder="8" style="border-color: {{efe.ramBd}}">
<sc-if value="{{efe.ram}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.ram}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="edisco" class="lbl">Disco *</label>
<input id="edisco" class="inp" type="text" value="{{ef.disco}}" sc-camel-on-change="{{onEfDisco}}" placeholder="SSD 256 GB" style="border-color: {{efe.discoBd}}">
<span class="muted" style="font-size: 15px">Tipo (HD, SSD ou NVMe) e tamanho.</span>
<sc-if value="{{efe.disco}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.disco}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="eso" class="lbl">Sistema operacional *</label>
<input id="eso" class="inp" type="text" value="{{ef.so}}" sc-camel-on-change="{{onEfSo}}" placeholder="Windows 11 Home" style="border-color: {{efe.soBd}}">
<sc-if value="{{efe.so}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.so}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="eacess" class="lbl">Acessórios</label>
<input id="eacess" class="inp" type="text" value="{{ef.acess}}" sc-camel-on-change="{{onEfAcess}}" placeholder="Se não houver, deixe vazio" style="border-color: {{efe.acessBd}}">
<sc-if value="{{efe.acess}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.acess}}</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 8px"><label for="econd" class="lbl">Condição física *</label><span class="muted" style="font-size: 14px">{{efCondCount}}</span></div>
<textarea id="econd" class="inp" value="{{ef.cond}}" sc-camel-on-change="{{onEfCond}}" placeholder="Arranhões, tela trincada, peças faltando" style="border-color: {{efe.condBd}}"></textarea>
<sc-if value="{{efe.cond}}" hint-placeholder-val="{{ false }}"><span class="err">{{efe.cond}}</span></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="rbtn" sc-camel-on-click="{{salvarEq}}" style="flex: 2 1 240px">CADASTRAR EQUIPAMENTO</button>
<button type="button" class="gbtn" sc-camel-on-click="{{goEquip}}" style="flex: 1 1 140px; min-height: 52px">Cancelar</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{isEquip}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="eyebrow"><span style="color: #6d28d9">◆</span> Passo 1 do caminho</span>
<h1 class="title"><span style="color: #6d28d9">Equipamentos</span> na bancada</h1>
<div><button type="button" class="rbtn" sc-camel-on-click="{{goNovoEq}}">+ CADASTRAR EQUIPAMENTO</button></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{eqLista}}" as="e" hint-placeholder-count="3">
<button type="button" class="glass" sc-camel-on-click="{{e.pick}}" aria-pressed="{{e.on}}" style="text-align: left; border-radius: 0; padding: 16px; display: flex; gap: 16px; align-items: center; color: #0f1646; outline: {{e.ring}}; outline-offset: 0">
<div style="width: 56px; height: 56px; border-radius: 0; background: #0b1030; display: flex; align-items: center; justify-content: center; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2)">
<svg aria-hidden="true" width="26" height="26" sc-camel-view-box="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{e.icon}}"></path></svg>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span class="code" style="font-size: 20px">{{e.codigo}}</span><span class="tag" style="font-size: 14px">{{e.tipo}}</span></div>
<span style="font-weight: 700">{{e.nome}}</span>
<span class="muted" style="font-size: 15px">{{e.resumo}}</span>
<span style="font-size: 15px; font-weight: 600">{{e.andamento}}</span>
</div>
</button>
</sc-for>
</div>
<section class="glass" aria-label="Ficha do equipamento" style="flex: 1.5 1 440px; min-width: 0; padding: 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="eyebrow">Ficha {{eq.codigo}}</span>
<h2 style="margin: 0; font-weight: 300; font-stretch: 125%; text-transform: uppercase; letter-spacing: 1px; font-size: 32px; line-height: 1.05">{{eq.nome}}</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 20px">
<sc-for list="{{eq.ficha}}" as="f" hint-placeholder-count="9"><div style="display: flex; flex-direction: column; gap: 2px"><span class="muted" style="font-weight: 700; font-size: 15px">{{f.k}}</span><span>{{f.v}}</span></div></sc-for>
</div>
<div class="sep" style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 20px; font-weight: 800">Ordens deste equipamento</h3>
<sc-for list="{{eq.ordens}}" as="o" hint-placeholder-count="2">
<button type="button" class="glass-soft" sc-camel-on-click="{{o.pick}}" style="text-align: left; min-height: 52px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; color: #0f1646">
<span class="code" style="font-size: 18px">{{o.numero}}</span>
<span class="chip" style="font-size: 14px; background: {{o.s.bg}}; color: {{o.s.fg}}; border: 1px solid {{o.s.bd}}">{{o.situacao}}</span>
<span class="muted" style="flex: 1 1 200px; font-size: 15px">{{o.rotulo}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="rbtn" sc-camel-on-click="{{eq.abrirOS}}" style="flex: 2 1 260px">ABRIR OS PARA ESTE EQUIPAMENTO</button>
<button type="button" class="gbtn" sc-camel-on-click="{{eq.upgrade}}" style="flex: 1 1 180px; min-height: 52px">
<svg aria-hidden="true" width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
Ver upgrades
</button>
</div>
</section>
</div>
</div>
</sc-if>

<sc-if value="{{isMontar}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="eyebrow"><span style="color: #6d28d9">◆</span> Montar meu computador</span>
<h1 class="title">Monte e <span style="color: #6d28d9">compare</span></h1>
<span class="muted" style="max-width: 640px">Conte o que você quer fazer com a máquina. O sistema sugere as peças, confere se elas combinam e guarda até 3 montagens para comparar lado a lado.</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 1.5 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<section class="glass" style="padding: 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px"><span class="code" style="width: 36px; height: 36px; border-radius: 0; background: #6d28d9; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px">1</span><h2 style="margin: 0; font-size: 22px; font-weight: 800">O que você quer</h2></div>
<div role="group" aria-label="Uso principal" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{usos}}" as="u" hint-placeholder-count="4">
<button type="button" class="{{u.cls}}" sc-camel-on-click="{{u.pick}}" aria-pressed="{{u.on}}" style="flex: 1 1 150px">
<svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{u.icon}}"></path></svg>
{{u.label}}
</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="mdesc" class="lbl">Descreva com suas palavras</label>
<textarea id="mdesc" class="inp" value="{{mDesc}}" sc-camel-on-change="{{onMDesc}}" placeholder="Ex.: quero editar vídeos do celular e jogar no fim de semana, sem muito barulho"></textarea>
</div>
<sc-if value="{{mErr}}" hint-placeholder-val="{{ false }}"><span class="err">{{mErr}}</span></sc-if>
<sc-if value="{{mSug}}" hint-placeholder-val="{{ false }}"><div role="status" class="ok">{{mSug}}</div></sc-if>
<button type="button" class="rbtn" sc-camel-on-click="{{sugerir}}" style="align-self: flex-start">
<svg aria-hidden="true" width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg>
SUGERIR CONFIGURAÇÃO
</button>
</section>

<section class="glass" style="padding: 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px"><span class="code" style="width: 36px; height: 36px; border-radius: 0; background: #6d28d9; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px">2</span><h2 style="margin: 0; font-size: 22px; font-weight: 800">Peças</h2><span class="muted" style="margin-left: auto; font-size: 15px">Troque qualquer peça. A conferência atualiza na hora.</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<sc-for list="{{pecas}}" as="p" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="{{p.id}}" class="lbl" style="display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.icon}}"></path></svg>
{{p.label}}
</label>
<sc-raw-select id="{{p.id}}" class="inp" value="{{p.value}}" sc-camel-on-change="{{p.onChange}}" aria-invalid="{{p.bad}}" style="border-color: {{p.bd}}">
<sc-for list="{{p.opts}}" as="o"><option value="{{o.v}}">{{o.l}}</option></sc-for>
</sc-raw-select>
<span class="muted" style="font-size: 14px">{{p.info}}</span>
</div>
</sc-for>
</div>
</section>
</div>

<aside class="glass" style="flex: 1 1 340px; min-width: 0; padding: 26px; display: flex; flex-direction: column; gap: 18px">
<span class="eyebrow">Conferência da montagem</span>
<div style="display: flex; gap: 14px; flex-wrap: wrap">
<div class="glass-soft" style="flex: 1 1 130px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span class="muted" style="font-size: 14px; font-weight: 700">Consumo estimado</span>
<span class="code" style="font-size: 38px; line-height: 1">{{consumo}} W</span>
</div>
<div class="glass-soft" style="flex: 1 1 130px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<span class="muted" style="font-size: 14px; font-weight: 700">Fonte escolhida</span>
<span class="code" style="font-size: 38px; line-height: 1">{{fonteW}} W</span>
</div>
</div>
<div style="height: 10px; border-radius: 999px; background: rgba(15,22,70,0.08); overflow: hidden" role="img" aria-label="{{usoFonteLabel}}">
<div style="height: 100%; width: {{usoFonte}}; border-radius: 999px; background: {{usoFonteCor}}"></div>
</div>
<span class="muted" style="font-size: 15px">{{usoFonteLabel}}</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{checks}}" as="c" hint-placeholder-count="4">
<li style="display: flex; gap: 10px; align-items: flex-start">
<span style="width: 26px; height: 26px; border-radius: 999px; background: {{c.bg}}; display: flex; align-items: center; justify-content: center; flex: none">
<svg aria-hidden="true" width="15" height="15" sc-camel-view-box="0 0 24 24" fill="none" stroke="{{c.fg}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{c.icon}}"></path></svg>
</span>
<span style="color: {{c.fg}}; font-weight: {{c.fw}}">{{c.txt}}</span>
</li>
</sc-for>
</ul>
<div class="sep" style="display: flex; flex-direction: column; gap: 10px">
<label for="mnome" class="lbl">Nome desta montagem</label>
<input id="mnome" class="inp" type="text" value="{{mNome}}" sc-camel-on-change="{{onMNome}}" placeholder="Ex.: Jogos econômico">
<sc-if value="{{salvarErr}}" hint-placeholder-val="{{ false }}"><span class="err">{{salvarErr}}</span></sc-if>
<button type="button" class="dbtn" sc-camel-on-click="{{salvarCfg}}">
<svg aria-hidden="true" width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v14H4zM14 5h6v14h-6z"></path></svg>
SALVAR PARA COMPARAR ({{nSalvos}}/3)
</button>
</div>
</aside>
</div>

<section class="glass" style="padding: 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap"><span class="code" style="width: 36px; height: 36px; border-radius: 0; background: #6d28d9; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px">3</span><h2 style="margin: 0; font-size: 22px; font-weight: 800">Comparação</h2><span class="muted" style="font-size: 15px">O ponto vermelho marca o que muda entre as montagens.</span></div>
<sc-if value="{{semSalvos}}" hint-placeholder-val="{{ false }}">
<div class="glass-soft" style="padding: 22px; color: #4d5588">Nenhuma montagem salva ainda. Monte acima e toque em Salvar para comparar.</div>
</sc-if>
<sc-if value="{{temSalvos}}" hint-placeholder-val="{{ true }}">
<div style="overflow-x: auto">
<div style="min-width: 720px; display: flex; flex-direction: column; gap: 6px">
<div style="display: grid; grid-template-columns: 170px {{cmpCols}}; gap: 10px; align-items: end">
<span></span>
<sc-for list="{{salvos}}" as="s" hint-placeholder-count="2">
<div class="glass-soft" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: #0b1030; color: #ffffff; border-color: #0b1030">
<span class="code" style="font-size: 14px; letter-spacing: 2px; color: #a78bfa">MONTAGEM {{s.letra}}</span>
<span style="font-weight: 800; font-size: 18px; line-height: 1.2">{{s.nome}}</span>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<button type="button" sc-camel-on-click="{{s.carregar}}" style="min-height: 40px; padding: 0 12px; border-radius: 0; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.12); color: #ffffff; font-weight: 600; font-size: 14px">Editar</button>
<button type="button" sc-camel-on-click="{{s.remover}}" aria-label="Remover montagem {{s.letra}}" style="min-height: 40px; padding: 0 12px; border-radius: 0; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #ffffff; font-weight: 600; font-size: 14px">Remover</button>
</div>
</div>
</sc-for>
</div>
<sc-for list="{{cmpRows}}" as="r" hint-placeholder-count="9">
<div style="display: grid; grid-template-columns: 170px {{cmpCols}}; gap: 10px; align-items: stretch">
<span style="font-weight: 700; padding: 12px 0; font-size: 15px">{{r.label}}</span>
<sc-for list="{{r.cells}}" as="c">
<div class="glass-soft" style="padding: 12px 14px; display: flex; gap: 8px; align-items: flex-start; font-size: 15px; font-weight: {{c.fw}}">
<sc-if value="{{c.diff}}" hint-placeholder-val="{{ false }}"><span aria-label="muda" style="width: 8px; height: 8px; border-radius: 999px; background: #6d28d9; margin-top: 7px; flex: none"></span></sc-if>
<span style="color: {{c.fg}}">{{c.v}}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
</sc-if>
</section>
</div>
</sc-if>

<sc-if value="{{isUpgrade}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="eyebrow"><span style="color: #6d28d9">◆</span> Upgrade</span>
<h1 class="title">O que dá para <span style="color: #6d28d9">melhorar</span></h1>
<span class="muted" style="max-width: 680px">Mostre o que a sua máquina tem: um PDF, uma foto da tela de configurações ou um texto. O sistema lê as peças e procura na internet o que é compatível com ela.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section class="glass" style="flex: 1 1 420px; min-width: 0; padding: 26px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 12px"><span class="code" style="width: 36px; height: 36px; border-radius: 0; background: #6d28d9; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 18px">1</span><h2 style="margin: 0; font-size: 22px; font-weight: 800">Sua máquina</h2></div>
<div role="tablist" aria-label="Como informar a máquina" class="glass-soft" style="display: flex; flex-wrap: wrap; gap: 0; padding: 0; border-radius: 0">
<sc-for list="{{upModos}}" as="m" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{m.on}}" sc-camel-on-click="{{m.pick}}" class="{{m.cls}}" style="flex: 1 1 140px; box-shadow: none">{{m.label}}</button>
</sc-for>
</div>

<sc-if value="{{upIsArquivo}}" hint-placeholder-val="{{ true }}">
<label for="upfile" class="glass-soft" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 30px 20px; border: 2px dashed rgba(15,22,70,0.2); text-align: center; cursor: pointer">
<span style="width: 60px; height: 60px; border-radius: 0; background: #0b1030; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(15,22,70,0.22)">
